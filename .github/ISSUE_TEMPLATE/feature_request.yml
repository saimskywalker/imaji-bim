name: Feature request
description: Suggest a compliance rule or IFC support
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Rules are most useful when they catch things real model reviews catch. A proposal with an example of a model element that should fail it is much easier to land.
  - type: textarea
    id: proposal
    attributes:
      label: What you would like added
      description: The check, calculation or procedure, and how you would call it.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: SNI number, edition and clause
      description: Which document and edition it comes from. No copied text or tables, please.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: A worked example
      description: >
        Inputs and the expected result, with where the example comes from (the standard,
        or a textbook with title, edition and page). This is what the test will be built on.
  - type: textarea
    id: use
    attributes:
      label: Why you need it
      description: The design or review task this would help with.
  - type: dropdown
    id: ai-use
    attributes:
      label: Did you use an AI tool to write this issue?
      options:
        - "No"
        - "Yes, for parts"
        - "Yes, mostly"
    validations:
      required: true
  - type: input
    id: ai-tool
    attributes:
      label: If yes, which tool and model?
      description: Required if you answered yes above, for example "Claude Code, Opus 5.5" or "Copilot, GPT-5".
  - type: checkboxes
    id: own-words
    attributes:
      label: Your own words
      description: Please write the issue in your own words; short and plain is fine. It shows us what you understood. Please don't paste generated text.
      options:
        - label: I wrote this issue in my own words.
